<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'Times New Roman', Times, serif" font-size="21">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <marker id="small" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#000" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="1000" height="600" fill="white"/>

  <!-- deformed strip: half annulus about (150, 316) with radii 161 (T = -h/2) and 221 (T = h/2) -->
  <path d="M 150 95 A 221 221 0 0 1 150 537 L 150 477 A 161 161 0 0 0 150 155 Z"
        fill="#e6e6e6" stroke="#000" stroke-width="1.8" stroke-dasharray="9 5"/>

  <!-- reference strip -->
  <rect x="150" y="95" width="600" height="60" fill="none" stroke="#000" stroke-width="2.5"/>
  <line x1="150" y1="125" x2="750" y2="125" stroke="#000" stroke-width="1" stroke-dasharray="14 4 3 4"/>

  <!-- clamped end -->
  <rect x="118" y="65" width="32" height="120" fill="url(#hatch)" stroke="#000" stroke-width="1.5"/>
  <text x="30" y="60">clamped</text>
  <line x1="95" y1="66" x2="122" y2="85" stroke="#000" stroke-width="1"/>

  <!-- growth along X, increasing with T -->
  <g stroke="#000" stroke-width="2" marker-end="url(#arrow)">
    <line x1="560" y1="107" x2="712" y2="107"/>
    <line x1="560" y1="125" x2="670" y2="125"/>
    <line x1="560" y1="143" x2="628" y2="143"/>
  </g>
  <text x="560" y="45">growth stretch 1 + <tspan font-style="italic">κT</tspan> along <tspan font-style="italic">X</tspan></text>
  <line x1="650" y1="52" x2="640" y2="100" stroke="#000" stroke-width="1"/>

  <!-- dimensions -->
  <line x1="150" y1="20" x2="150" y2="62" stroke="#000" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="750" y1="20" x2="750" y2="90" stroke="#000" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="152" y1="30" x2="748" y2="30" stroke="#000" stroke-width="1.2" marker-start="url(#small)" marker-end="url(#small)"/>
  <text x="300" y="25" font-style="italic">L</text>
  <line x1="755" y1="95" x2="800" y2="95" stroke="#000" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="755" y1="155" x2="800" y2="155" stroke="#000" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="790" y1="97" x2="790" y2="153" stroke="#000" stroke-width="1.2" marker-start="url(#small)" marker-end="url(#small)"/>
  <text x="802" y="133" font-style="italic">h</text>
  <text x="770" y="215">traction free</text>
  <line x1="800" y1="198" x2="745" y2="158" stroke="#000" stroke-width="1"/>

  <!-- coordinates along the strip -->
  <line x1="760" y1="480" x2="840" y2="480" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="760" y1="480" x2="760" y2="400" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="848" y="487" font-style="italic">X</text>
  <text x="752" y="390" font-style="italic">T</text>

  <!-- radius of the exact arc -->
  <circle cx="150" cy="316" r="3.5" fill="#000"/>
  <line x1="150" y1="316" x2="285" y2="451" stroke="#000" stroke-width="1.5" marker-end="url(#small)"/>
  <text x="168" y="420"><tspan font-style="italic">κ</tspan><tspan dy="-9" font-size="15">−1</tspan></text>
  <text x="390" y="322">exact solution: half circle</text>
  <line x1="385" y1="315" x2="368" y2="310" stroke="#000" stroke-width="1"/>
</svg>
