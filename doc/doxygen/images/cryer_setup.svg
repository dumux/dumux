    <line x1="138" y1="395" x2="128" y2="405"/>
    <line x1="138" y1="410" x2="128" y2="420"/>
  </g>

  <!-- Surface load p0 (thick, inward) -->
  <g stroke="#000" stroke-width="3.5" fill="none">
