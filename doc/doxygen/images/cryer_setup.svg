    <circle cx="144" cy="195" r="6"/>
    <circle cx="144" cy="225" r="6"/>
    <circle cx="144" cy="255" r="6"/>
    <circle cx="144" cy="285" r="6"/>
    <circle cx="144" cy="315" r="6"/>
    <circle cx="144" cy="345" r="6"/>
