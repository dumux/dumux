<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 50 520 460" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="loadArrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <marker id="thinArrow" viewBox="0 0 10 10" refX="9" refY="5"
