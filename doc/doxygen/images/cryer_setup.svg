    <line x1="300" y1="422" x2="290" y2="432"/>
    <line x1="315" y1="422" x2="305" y2="432"/>
    <line x1="330" y1="422" x2="320" y2="432"/>
    <line x1="345" y1="422" x2="335" y2="432"/>
    <line x1="360" y1="422" x2="350" y2="432"/>
