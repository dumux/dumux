  </g>
  <text x="215.2" y="82.2" font-size="20" font-style="italic" fill="#000">p<tspan dy="5" font-size="14" font-style="normal" font-family="Times New Roman, serif">0</tspan></text>

  <!-- Drainage p_f = 0 (thin, outward) -->
  <g stroke="#000" stroke-width="1.6" fill="none">
    <line x1="411.5" y1="325" x2="446.7" y2="313.6" marker-end="url(#thinArrow)"/>
