  <!-- Radius R0 -->
  <line x1="150" y1="410" x2="338.8" y2="221.2" stroke="#000" stroke-width="1.6" marker-end="url(#thinArrow)"/>
  <text x="211.5" y="304.5" font-size="20" font-style="italic" fill="#000">R<tspan dy="5" font-size="14" font-style="normal" font-family="Times New Roman, serif">0</tspan></text>

  <!-- Coordinate system -->
  <g stroke="#000" stroke-width="1.8" fill="none">
    <line x1="40" y1="490" x2="90" y2="490" marker-end="url(#thinArrow)"/>
    <line x1="40" y1="490" x2="40" y2="440" marker-end="url(#thinArrow)"/>
