<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" font-family="'Times New Roman', Times, serif" font-size="21">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <marker id="small" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#000" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="1000" height="780" fill="white"/>

  <!-- upper half disk: lower half of the disk with centre (400, 90), radius 300 -->
  <path d="M 100 90 A 300 300 0 0 0 700 90 Z" fill="white" stroke="#000" stroke-width="2.5"/>
  <!-- lower half disk: upper half of the disk with centre (400, 690) -->
  <path d="M 100 690 A 300 300 0 0 1 700 690 Z" fill="white" stroke="#000" stroke-width="2.5"/>

  <!-- platens with rollers -->
  <rect x="80" y="48" width="640" height="18" fill="url(#hatch)" stroke="#000" stroke-width="1.5"/>
  <rect x="80" y="714" width="640" height="18" fill="url(#hatch)" stroke="#000" stroke-width="1.5"/>
  <g fill="white" stroke="#000" stroke-width="1.2">
    <circle cx="130" cy="78" r="6"/><circle cx="190" cy="78" r="6"/><circle cx="250" cy="78" r="6"/>
    <circle cx="310" cy="78" r="6"/><circle cx="370" cy="78" r="6"/><circle cx="430" cy="78" r="6"/>
    <circle cx="490" cy="78" r="6"/><circle cx="550" cy="78" r="6"/><circle cx="610" cy="78" r="6"/>
    <circle cx="670" cy="78" r="6"/>
    <circle cx="130" cy="702" r="6"/><circle cx="190" cy="702" r="6"/><circle cx="250" cy="702" r="6"/>
    <circle cx="310" cy="702" r="6"/><circle cx="370" cy="702" r="6"/><circle cx="430" cy="702" r="6"/>
    <circle cx="490" cy="702" r="6"/><circle cx="550" cy="702" r="6"/><circle cx="610" cy="702" r="6"/>
    <circle cx="670" cy="702" r="6"/>
  </g>

  <!-- prescribed approach of the platens -->
  <line x1="760" y1="22" x2="760" y2="70" stroke="#000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="775" y="40">platen moves by <tspan font-style="italic">Δ</tspan></text>
  <text x="775" y="66">frictionless: <tspan font-style="italic">u</tspan><tspan dy="5" font-size="15" font-style="italic">y</tspan><tspan dy="-5"> = −</tspan><tspan font-style="italic">Δ</tspan></text>
  <line x1="760" y1="758" x2="760" y2="710" stroke="#000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="775" y="722"><tspan font-style="italic">u</tspan><tspan dy="5" font-size="15" font-style="italic">y</tspan><tspan dy="-5"> = </tspan><tspan font-style="italic">Δ</tspan></text>
  <text x="775" y="748">platen moves by <tspan font-style="italic">Δ</tspan></text>

  <!-- symmetry axis -->
  <line x1="400" y1="96" x2="400" y2="684" stroke="#000" stroke-width="1.3" stroke-dasharray="18 5 3 5"/>
  <text x="410" y="210"><tspan font-style="italic">u</tspan><tspan dy="5" font-size="15" font-style="italic">x</tspan><tspan dy="-5"> = 0 on </tspan><tspan font-style="italic">x</tspan> = 0</text>

  <!-- radius -->
  <line x1="400" y1="90" x2="187.9" y2="302.1" stroke="#000" stroke-width="1.5" marker-end="url(#small)"/>
  <circle cx="400" cy="90" r="3.5" fill="#000"/>
  <text x="268" y="185" font-style="italic">R</text>
  <line x1="400" y1="690" x2="612.1" y2="477.9" stroke="#000" stroke-width="1.5" marker-end="url(#small)"/>
  <circle cx="400" cy="690" r="3.5" fill="#000"/>
  <text x="520" y="610" font-style="italic">R</text>

  <!-- free surfaces -->
  <text x="40" y="300">traction free</text>
  <line x1="150" y1="292" x2="168" y2="270" stroke="#000" stroke-width="1"/>
  <text x="40" y="500">traction free</text>
  <line x1="150" y1="486" x2="168" y2="508" stroke="#000" stroke-width="1"/>

  <!-- coordinate axes -->
  <line x1="28" y1="660" x2="68" y2="660" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="28" y1="660" x2="28" y2="620" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="58" y="686" font-style="italic">x</text>
  <text x="36" y="626" font-style="italic">y</text>

  <!-- contact point and inset -->
  <circle cx="400" cy="390" r="14" fill="none" stroke="#000" stroke-width="1.2"/>
  <line x1="414" y1="390" x2="700" y2="390" stroke="#000" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="700" y="270" width="280" height="240" fill="white" stroke="#000" stroke-width="1.5"/>
  <!-- deformed surfaces near the contact, flat over the width 2a -->
  <path d="M 712 300 C 745 350, 775 390, 800 390 L 880 390 C 905 390, 935 350, 968 300" fill="none" stroke="#000" stroke-width="2.5"/>
  <path d="M 712 480 C 745 430, 775 390, 800 390 L 880 390 C 905 390, 935 430, 968 480" fill="none" stroke="#000" stroke-width="2.5"/>
  <!-- elliptic contact pressure -->
  <path d="M 800 390 A 40 62 0 0 1 880 390" fill="none" stroke="#000" stroke-width="1.5"/>
  <g stroke="#000" stroke-width="1">
    <line x1="810" y1="390" x2="810" y2="352"/>
    <line x1="820" y1="390" x2="820" y2="339"/>
    <line x1="830" y1="390" x2="830" y2="332"/>
    <line x1="840" y1="390" x2="840" y2="328"/>
    <line x1="850" y1="390" x2="850" y2="332"/>
    <line x1="860" y1="390" x2="860" y2="339"/>
    <line x1="870" y1="390" x2="870" y2="352"/>
  </g>
  <text x="854" y="318" font-style="italic">p</text>
  <text x="866" y="323" font-size="15">0</text>
  <!-- contact width -->
  <line x1="800" y1="396" x2="800" y2="462" stroke="#000" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="880" y1="396" x2="880" y2="462" stroke="#000" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="802" y1="454" x2="878" y2="454" stroke="#000" stroke-width="1.2" marker-start="url(#small)" marker-end="url(#small)"/>
  <text x="826" y="482">2<tspan font-style="italic">a</tspan></text>
</svg>
