<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Times New Roman', Times, serif">
  <defs>
    <marker id="dimArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#000" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="400" fill="white"/>

  <!-- cross section through the center, x from -2 m to 2 m, vertical scale exaggerated -->

  <!-- water at t = 0 between the shoreline points, free surface and bed are parabolas -->
  <path d="M 142.2 171.4 Q 320 78.6 497.8 171.4 Q 320 428.6 142.2 171.4 Z" fill="#dce9f5"/>
  <path d="M 142.2 171.4 Q 320 78.6 497.8 171.4" fill="none" stroke="#000" stroke-width="1.2"/>

  <!-- bed z = D0 r^2 / L^2 -->
  <path d="M 80 66.6 Q 320 533.4 560 66.6 L 560 80.6 Q 320 547.4 80 80.6 Z" fill="url(#hatch)"/>
  <path d="M 80 66.6 Q 320 533.4 560 66.6" fill="none" stroke="#000" stroke-width="1.5"/>

  <!-- walls at x = -2 m and x = 2 m -->
  <line x1="80" y1="30" x2="80" y2="66.6" stroke="#000" stroke-width="1.5"/>
  <line x1="560" y1="30" x2="560" y2="66.6" stroke="#000" stroke-width="1.5"/>
  <text x="70" y="50" font-size="18" fill="#000" text-anchor="end">wall</text>
  <text x="570" y="50" font-size="18" fill="#000">wall</text>

  <!-- water level at rest, meeting the bed at r = L -->
  <line x1="128" y1="150" x2="512" y2="150" stroke="#000" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="130" y="96" font-size="18" fill="#000">water at rest</text>
  <line x1="190" y1="102" x2="215" y2="148" stroke="#000" stroke-width="0.8"/>

  <!-- D0 from the bottom of the bowl to the water level at rest -->
  <line x1="320" y1="152" x2="320" y2="298" stroke="#000" stroke-width="1" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  <text x="328" y="234" font-size="21" font-style="italic" fill="#000">D<tspan font-style="normal" font-size="15" baseline-shift="sub">0</tspan></text>

  <!-- initial elevation of the free surface at the center -->
  <line x1="300" y1="126" x2="300" y2="149" stroke="#000" stroke-width="1" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  <text x="292" y="143" font-size="21" font-style="italic" fill="#000" text-anchor="end">η<tspan font-style="normal" font-size="15" baseline-shift="sub">0</tspan></text>
  <text x="530" y="96" font-size="18" fill="#000" text-anchor="end">free surface at <tspan font-style="italic">t</tspan> = 0</text>
  <line x1="430" y1="102" x2="400" y2="133" stroke="#000" stroke-width="0.8"/>

  <!-- shoreline -->
  <line x1="497.8" y1="171.4" x2="530" y2="205" stroke="#000" stroke-width="0.8"/>
  <text x="534" y="214" font-size="18" fill="#000">shoreline</text>

  <!-- radius L of the shoreline at rest -->
  <line x1="320" y1="300" x2="320" y2="352" stroke="#000" stroke-width="0.8"/>
  <line x1="512" y1="150" x2="512" y2="352" stroke="#000" stroke-width="0.8" stroke-dasharray="2,3"/>
  <line x1="322" y1="346" x2="510" y2="346" stroke="#000" stroke-width="1" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  <text x="410" y="340" font-size="21" font-style="italic" fill="#000">L</text>
  <text x="320" y="370" font-size="18" fill="#000" text-anchor="middle"><tspan font-style="italic">r</tspan> = 0</text>

</svg>
