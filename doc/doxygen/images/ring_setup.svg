<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'Times New Roman', Times, serif" font-size="21">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <marker id="small" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
  </defs>

  <rect width="1000" height="600" fill="white"/>

  <!-- ring: wall between radii 163 and 177 px about (270, 300) -->
  <path fill-rule="evenodd" fill="#e6e6e6" stroke="#000" stroke-width="2"
        d="M 447 300 A 177 177 0 1 0 93 300 A 177 177 0 1 0 447 300 Z M 433 300 A 163 163 0 1 1 107 300 A 163 163 0 1 1 433 300 Z"/>

  <!-- symmetry axes -->
  <line x1="40" y1="300" x2="500" y2="300" stroke="#000" stroke-width="1.2" stroke-dasharray="18 5 3 5"/>
  <line x1="270" y1="40" x2="270" y2="560" stroke="#000" stroke-width="1.2" stroke-dasharray="18 5 3 5"/>
  <text x="300" y="58"><tspan font-style="italic">u</tspan><tspan dy="5" font-size="15" font-style="italic">x</tspan><tspan dy="-5"> = 0 on </tspan><tspan font-style="italic">x</tspan> = 0</text>
  <text x="118" y="332"><tspan font-style="italic">u</tspan><tspan dy="5" font-size="15" font-style="italic">y</tspan><tspan dy="-5"> = 0 on </tspan><tspan font-style="italic">y</tspan> = 0</text>

  <!-- external pressure, radial arrows -->
  <g stroke="#000" stroke-width="1.8" marker-end="url(#arrow)">
    <line x1="495" y1="300" x2="452" y2="300"/>
    <line x1="478" y1="214" x2="438" y2="231"/>
    <line x1="429" y1="141" x2="398" y2="172"/>
    <line x1="356" y1="92" x2="339" y2="132"/>
    <line x1="184" y1="92" x2="201" y2="132"/>
    <line x1="111" y1="141" x2="142" y2="172"/>
    <line x1="62" y1="214" x2="102" y2="231"/>
    <line x1="62" y1="386" x2="102" y2="369"/>
    <line x1="111" y1="459" x2="142" y2="428"/>
    <line x1="184" y1="508" x2="201" y2="468"/>
    <line x1="356" y1="508" x2="339" y2="468"/>
    <line x1="429" y1="459" x2="398" y2="428"/>
    <line x1="478" y1="386" x2="438" y2="369"/>
  </g>
  <text x="410" y="95"><tspan font-style="italic">p</tspan> (1 − <tspan font-style="italic">ε</tspan> cos 2<tspan font-style="italic">φ</tspan>)</text>

  <!-- midline radius -->
  <line x1="270" y1="300" x2="385.3" y2="415.3" stroke="#000" stroke-width="1.5" marker-end="url(#small)"/>
  <circle cx="270" cy="300" r="3.5" fill="#000"/>
  <text x="300" y="380" font-style="italic">R</text>
  <!-- angle -->
  <path d="M 330 300 A 60 60 0 0 0 312.4 257.6" fill="none" stroke="#000" stroke-width="1.2"/>
  <line x1="270" y1="300" x2="340.7" y2="229.3" stroke="#000" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="336" y="285" font-style="italic">φ</text>
  <!-- wall thickness -->
  <line x1="433" y1="470" x2="433" y2="530" stroke="#000" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="447" y1="470" x2="447" y2="530" stroke="#000" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="410" y1="520" x2="431" y2="520" stroke="#000" stroke-width="1.2" marker-end="url(#small)"/>
  <line x1="470" y1="520" x2="449" y2="520" stroke="#000" stroke-width="1.2" marker-end="url(#small)"/>
  <text x="478" y="528" font-style="italic">t</text>

  <!-- collapsed ring with line contact -->
  <g transform="translate(760 300)">
    <path fill-rule="evenodd" fill="#e6e6e6" stroke="#000" stroke-width="2"
          d="M -40 -14 L 40 -14 C 90 -14, 110 -90, 165 -90 C 215 -90, 225 -40, 225 0 C 225 40, 215 90, 165 90 C 110 90, 90 14, 40 14 L -40 14 C -90 14, -110 90, -165 90 C -215 90, -225 40, -225 0 C -225 -40, -215 -90, -165 -90 C -110 -90, -90 -14, -40 -14 Z
             M -40 0 L 40 0 C 90 0, 115 -76, 165 -76 C 205 -76, 211 -38, 211 0 C 211 38, 205 76, 165 76 C 115 76, 90 0, 40 0 L -40 0 C -90 0, -115 76, -165 76 C -205 76, -211 38, -211 0 C -211 -38, -205 -76, -165 -76 C -115 -76, -90 0, -40 0 Z"/>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#000" stroke-width="3"/>
    <text x="-120" y="-150">opposite walls in contact</text>
    <line x1="0" y1="-128" x2="0" y2="-20" stroke="#000" stroke-width="1"/>
    <line x1="-40" y1="40" x2="-40" y2="128" stroke="#000" stroke-width="0.8" stroke-dasharray="3 3"/>
    <line x1="40" y1="40" x2="40" y2="128" stroke="#000" stroke-width="0.8" stroke-dasharray="3 3"/>
    <line x1="-38" y1="120" x2="38" y2="120" stroke="#000" stroke-width="1.2" marker-start="url(#small)" marker-end="url(#small)"/>
    <text x="-14" y="150">2<tspan font-style="italic">b</tspan></text>
  </g>
</svg>
