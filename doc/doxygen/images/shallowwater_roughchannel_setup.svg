<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="'Times New Roman', Times, serif">
  <defs>
    <marker id="dimArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#000" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="680" height="430" fill="white"/>

  <text x="40" y="40" font-size="19" fill="#000">side view</text>
  <polygon points="120.0,100.0 540.0,140.0 540.0,190.0 120.0,150.0" fill="#dce9f5"/>
  <polygon points="120.0,150.0 540.0,190.0 540.0,202.0 120.0,162.0" fill="url(#hatch)"/>
  <line x1="120.0" y1="150.0" x2="540.0" y2="190.0" stroke="#000" stroke-width="1.5"/>
  <line x1="120.0" y1="100.0" x2="540.0" y2="140.0" stroke="#000" stroke-width="1.2"/>
  <line x1="75.0" y1="140.0" x2="115.0" y2="140.0" stroke="#000" stroke-width="1" marker-end="url(#flowArrow)"/>
  <line x1="75.0" y1="130.0" x2="115.0" y2="130.0" stroke="#000" stroke-width="1" marker-end="url(#flowArrow)"/>
  <line x1="75.0" y1="120.0" x2="115.0" y2="120.0" stroke="#000" stroke-width="1" marker-end="url(#flowArrow)"/>
  <line x1="75.0" y1="110.0" x2="115.0" y2="110.0" stroke="#000" stroke-width="1" marker-end="url(#flowArrow)"/>
  <text x="70.0" y="86.0" font-size="18" fill="#000" text-anchor="middle">inflow:</text>
  <text x="70.0" y="178.0" font-size="18" fill="#000" text-anchor="middle">discharge <tspan font-style="italic" font-size="20">q</tspan></text>
  <text x="550.0" y="161.0" font-size="18" fill="#000">outflow:</text>
  <text x="550.0" y="181.0" font-size="18" fill="#000">depth <tspan font-style="italic" font-size="20">h</tspan><tspan font-style="normal" font-size="15" baseline-shift="sub">n</tspan></text>
  <line x1="220.0" y1="157.52380952380952" x2="220.0" y2="111.52380952380952" stroke="#000" stroke-width="1" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  <text x="228.0" y="140.52380952380952" font-size="21" font-style="italic" fill="#000">h<tspan font-style="normal" font-size="15" baseline-shift="sub">n</tspan></text>
  <line x1="340.0" y1="145.95238095238096" x2="400.0" y2="151.66666666666666" stroke="#000" stroke-width="1.4" marker-end="url(#flowArrow)"/>
  <text x="406.0" y="157.66666666666666" font-size="21" font-style="italic" fill="#000">u<tspan font-style="normal" font-size="15" baseline-shift="sub">n</tspan></text>
  <line x1="500.0" y1="178.1904761904762" x2="450.0" y2="173.42857142857142" stroke="#000" stroke-width="1.4" marker-end="url(#flowArrow)"/>
  <text x="330.0" y="222.1904761904762" font-size="20" fill="#000">bed shear stress <tspan font-style="italic">τ</tspan><tspan font-style="normal" font-size="15" baseline-shift="sub">b</tspan> (Manning)</text>
  <polyline points="185.0,186.1904761904762 285.0,186.1904761904762 285.0,195.71428571428572" fill="none" stroke="#000" stroke-width="0.8"/>
  <line x1="185.0" y1="186.1904761904762" x2="285.0" y2="195.71428571428572" stroke="#000" stroke-width="0.8"/>
  <text x="291.0" y="195.71428571428572" font-size="19" font-style="italic" fill="#000">S</text>
  <text x="235.0" y="182.1904761904762" font-size="18" fill="#000" text-anchor="middle">1</text>
  <text x="40" y="276.0" font-size="19" fill="#000">top view</text>
  <rect x="120.0" y="300.0" width="420.0" height="50.0" fill="#dce9f5"/>
  <rect x="120.0" y="290.0" width="420.0" height="10" fill="url(#hatch)"/>
  <rect x="120.0" y="350.0" width="420.0" height="10" fill="url(#hatch)"/>
  <line x1="120.0" y1="300.0" x2="540.0" y2="300.0" stroke="#000" stroke-width="1.5"/>
  <line x1="120.0" y1="350.0" x2="540.0" y2="350.0" stroke="#000" stroke-width="1.5"/>
  <text x="330.0" y="331.0" font-size="18" fill="#000" text-anchor="middle">walls without friction</text>
  <line x1="122.0" y1="380.0" x2="538.0" y2="380.0" stroke="#000" stroke-width="1" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  <text x="330.0" y="400.0" font-size="21" font-style="italic" fill="#000" text-anchor="middle">L</text>
  <line x1="560.0" y1="302.0" x2="560.0" y2="348.0" stroke="#000" stroke-width="1" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  <text x="568.0" y="331.0" font-size="21" font-style="italic" fill="#000">W</text>
</svg>
