<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="'Times New Roman', Times, serif" font-size="21">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <marker id="small" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#000" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="1000" height="620" fill="white"/>

  <!-- substrate x 200..740, y 170..530 with a break; film y 120..170 -->
  <path d="M 200 170 L 740 170 L 740 340 L 726 352 L 754 364 L 740 376 L 740 530 L 200 530 L 200 376 L 186 364 L 214 352 L 200 340 Z"
        fill="white" stroke="#000" stroke-width="2.5"/>
  <path d="M 200 340 L 740 340 M 200 376 L 740 376" stroke="#000" stroke-width="0.8" stroke-dasharray="5 4"/>
  <rect x="200" y="120" width="540" height="50" fill="#cccccc" stroke="#000" stroke-width="2.5"/>

  <!-- onset mode: two half wavelengths over L -->
  <path d="M 200 80 C 290 80, 380 106, 470 106 C 560 106, 650 80, 740 80" fill="none" stroke="#000" stroke-width="1.8" stroke-dasharray="9 5"/>

  <!-- clamped bottom -->
  <rect x="190" y="530" width="560" height="22" fill="url(#hatch)" stroke="#000" stroke-width="1.2"/>
  <text x="400" y="585">clamped: <tspan font-style="italic">u</tspan> = 0</text>

  <!-- sliding sides -->
  <g fill="white" stroke="#000" stroke-width="1.2">
    <circle cx="193" cy="200" r="6"/><circle cx="193" cy="260" r="6"/><circle cx="193" cy="320" r="6"/>
    <circle cx="193" cy="400" r="6"/><circle cx="193" cy="460" r="6"/><circle cx="193" cy="510" r="6"/>
    <circle cx="747" cy="200" r="6"/><circle cx="747" cy="260" r="6"/><circle cx="747" cy="320" r="6"/>
    <circle cx="747" cy="400" r="6"/><circle cx="747" cy="460" r="6"/><circle cx="747" cy="510" r="6"/>
  </g>
  <line x1="186" y1="190" x2="186" y2="520" stroke="#000" stroke-width="1.5"/>
  <line x1="754" y1="190" x2="754" y2="520" stroke="#000" stroke-width="1.5"/>
  <text x="20" y="450">sliding:</text>
  <text x="20" y="478"><tspan font-style="italic">u</tspan><tspan dy="5" font-size="15" font-style="italic">x</tspan><tspan dy="-5"> = 0</tspan></text>

  <!-- growth of the film along x -->
  <g stroke="#000" stroke-width="2" marker-end="url(#arrow)">
    <line x1="440" y1="145" x2="360" y2="145"/>
    <line x1="500" y1="145" x2="580" y2="145"/>
  </g>
  <text x="780" y="140">film: growth along <tspan font-style="italic">x</tspan>,</text>
  <text x="780" y="167"><tspan font-style="italic">μ</tspan> = 10, <tspan font-style="italic">λ</tspan> = 15</text>
  <line x1="776" y1="150" x2="742" y2="150" stroke="#000" stroke-width="1"/>
  <text x="780" y="290">substrate:</text>
  <text x="780" y="317"><tspan font-style="italic">μ</tspan> = 1, <tspan font-style="italic">λ</tspan> = 1.5</text>
  <text x="780" y="70">onset mode</text>
  <line x1="776" y1="64" x2="705" y2="84" stroke="#000" stroke-width="1"/>
  <text x="250" y="60">traction free</text>
  <line x1="300" y1="68" x2="300" y2="118" stroke="#000" stroke-width="1"/>

  <!-- dimensions -->
  <line x1="200" y1="30" x2="200" y2="96" stroke="#000" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="740" y1="30" x2="740" y2="96" stroke="#000" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="202" y1="35" x2="738" y2="35" stroke="#000" stroke-width="1.2" marker-start="url(#small)" marker-end="url(#small)"/>
  <text x="610" y="30" font-style="italic">L</text>
  <line x1="120" y1="120" x2="180" y2="120" stroke="#000" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="120" y1="170" x2="180" y2="170" stroke="#000" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="130" y1="122" x2="130" y2="168" stroke="#000" stroke-width="1.2" marker-start="url(#small)" marker-end="url(#small)"/>
  <text x="108" y="152" font-style="italic">h</text>
  <line x1="120" y1="530" x2="180" y2="530" stroke="#000" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="130" y1="172" x2="130" y2="528" stroke="#000" stroke-width="1.2" marker-start="url(#small)" marker-end="url(#small)"/>
  <text x="104" y="260" font-style="italic">H</text>

  <!-- axes -->
  <line x1="850" y1="520" x2="910" y2="520" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="850" y1="520" x2="850" y2="460" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="916" y="527" font-style="italic">x</text>
  <text x="843" y="450" font-style="italic">y</text>
</svg>
